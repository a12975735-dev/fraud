server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/frauddetection}
spring.datasource.username=${DB_USERNAME:fraud_gateway_user}
spring.datasource.password=${DB_PASSWORD:change-me-local-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
gateway.users.investigator.password=${INVESTIGATOR_PASSWORD:demo-investigator}
gateway.users.admin.password=${ADMIN_PASSWORD:demo-admin}
# Demo fallback only; set JWT_SECRET to a unique 32+ character secret outside source control for real use.
jwt.secret=${JWT_SECRET:development-only-jwt-secret-change-me-32}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=fraud-scoring-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.frauddetection.gateway
spring.kafka.consumer.properties.spring.json.value.default.type=com.frauddetection.gateway.TransactionMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Microservice Python ML Engine Integration Endpoints
scoring.service.url=${SCORING_SERVICE_URL:http://localhost:8000}
flask.service.url=${FLASK_SERVICE_URL:http://localhost:5000}
credit.scoring.endpoint=${FLASK_SERVICE_URL:http://localhost:5000}/api/v1/credit-score
biometrics.scoring.endpoint=${FLASK_SERVICE_URL:http://localhost:5000}/api/v1/biometrics/score

